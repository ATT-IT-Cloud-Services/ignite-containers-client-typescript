name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.1)'
        required: true
permissions:
  contents: write
  packages: write
jobs:
  publish:
    runs-on: leaseweb
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@att-it-cloud-services'
      - name: Build and publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          npm install --no-audit --no-fund
          npm version "$version" --no-git-tag-version --allow-same-version
          npm run build
          # A prerelease version (1.2.3-next.4) cannot be published without an
          # explicit dist-tag: npm refuses and the whole release job fails.
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          if npm view "@att-it-cloud-services/ignite-containers-client@$version" version >/dev/null 2>&1; then
            echo "version $version is already published; skipping npm publish"
          else
            npm publish --access public --tag "$dist_tag"
          fi
          npm pack --pack-destination .
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          tag="v$version"
          gh release view "$tag" >/dev/null 2>&1 ||             gh release create "$tag" --title "$tag" --notes "TypeScript client $tag."
          gh release upload "$tag" ./*.tgz --clobber
